name: Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          source: "."
          target: "/home/${{ secrets.AZURE_VM_USER }}/deploy_folder"

      - name: Run Docker Compose via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          command_timeout: 60m
          script: |
            echo ${{ secrets.AZURE_VM_PASSWORD }} | sudo -S DEBIAN_FRONTEND=noninteractive apt-get update
            echo ${{ secrets.AZURE_VM_PASSWORD }} | sudo -S DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose
            cd /home/${{ secrets.AZURE_VM_USER }}/deploy_folder
            echo ${{ secrets.AZURE_VM_PASSWORD }} | sudo -S docker system prune -a -f --volumes
            echo ${{ secrets.AZURE_VM_PASSWORD }} | sudo -S docker-compose up -d --build
