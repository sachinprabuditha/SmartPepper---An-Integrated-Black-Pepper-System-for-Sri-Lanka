events {
    worker_connections 1024;
}

http {
    # Resolve the container names
    upstream plantation {
        server plantation-api:5001;
    }

    upstream auction {
        server auction-api:5000;
    }

    upstream disease {
        server disease-api:5002;
    }

    upstream grading {
        server grading-api:3000;
    }

    server {
        listen 80;

        # Cross-Origin Resource Sharing
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        location /api/plantation/ {
            proxy_pass http://plantation/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/auction/ {
            proxy_pass http://auction/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/disease/ {
            proxy_pass http://disease/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/grading/ {
            proxy_pass http://grading/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Healthcheck endpoint
        location /health {
            return 200 'API Gateway is running';
            add_header Content-Type text/plain;
        }
    }
}
