version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - plantation-api
      - auction-api
      - disease-api
      - grading-api

  plantation-api:
    build:
      context: ./Planting-Management-Price-Prediction/plantationmanagement
    expose:
      - "5001"
    environment:
      - NODE_ENV=production
    # If using .env files, uncomment below and ensure they are copied to the VM
    # env_file:
    #   - ./Planting-Management-Price-Prediction/plantationmanagement/.env

  auction-api:
    build:
      context: ./SmartPepper-Auction-Blockchain-System/backend
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
    # env_file:
    #   - ./SmartPepper-Auction-Blockchain-System/backend/.env

  disease-api:
    build:
      context: ./SmartPepper-Auction-Blockchain-System/node_backend
    expose:
      - "5002"
    environment:
      - NODE_ENV=production

  grading-api:
    build:
      context: ./Quality-Grading/server
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
